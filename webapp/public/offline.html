<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5a44" />
    <title>Нет подключения · KitchenFlow</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #faf8f3; color: #202622; }
      main { width: min(28rem, calc(100% - 3rem)); text-align: center; }
      h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #59615c; }
      button { min-height: 2.75rem; border: 0; border-radius: 0.75rem; padding: 0 1rem; background: #1f5a44; color: white; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { background: #171a18; color: #f7f8f7; }
        p { color: #b6bdb8; }
        button { background: #4f9578; color: #0f1d17; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения</h1>
      <p>Для работы с остатками, документами и сменами KitchenFlow нужен интернет.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
